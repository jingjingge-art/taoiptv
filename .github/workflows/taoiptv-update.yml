name: Update tao IPTV playlist

on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Generate playlist
        run: python taoiptv_merge.py

      - name: Commit generated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iptv.txt taoiptv_tokens.txt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update IPTV playlist every 6 hours"
            git push
          fi
